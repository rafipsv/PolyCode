name: polycode
description: A modular, local-first code execution and compilation engine for Dart and Flutter with no backend.
version: 0.1.0-dev.1
homepage: https://github.com/rafipsv/PolyCode
repository: https://github.com/rafipsv/PolyCode
issue_tracker: https://github.com/rafipsv/PolyCode/issues
topics:
  - compiler
  - code-execution
  - runtime
  - webassembly
  - flutter

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.11.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
